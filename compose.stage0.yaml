name: xray-easy-stage0

services:
  init-supervisor-secret:
    image: alpine:3.22
    restart: "no"
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /target
        install -m 0400 -o 10001 -g 10001 /source/xray_supervisor_token /target/xray_supervisor_token
    volumes:
      - xray_supervisor_token_data:/target
    secrets:
      - source: xray_supervisor_token
        target: /source/xray_supervisor_token

  xray:
    build:
      context: .
      dockerfile: Dockerfile.xray
      args:
        XRAY_VERSION: ${XRAY_VERSION:-26.7.28}
    restart: unless-stopped
    user: "10001:10001"
    command:
      - --config-dir
      - /etc/xray
      - --xray-bin
      - /usr/local/bin/xray
      - --token-file
      - /run/secrets/xray_supervisor_token
      - --listen
      - 172.31.240.2:10086
    ports:
      - "${XRAY_PUBLIC_PORT:-443}:8443/tcp"
    volumes:
      - ./prototype/config:/etc/xray:ro
      - xray_supervisor_token_data:/run/secrets:ro
    networks:
      control:
        ipv4_address: 172.31.240.2
      egress: {}
    depends_on:
      init-supervisor-secret:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/xray-supervisor
        - healthcheck
        - --url
        - http://172.31.240.2:10086/health
        - --token-file
        - /run/secrets/xray_supervisor_token
      interval: 10s
      timeout: 5s
      retries: 5

secrets:
  xray_supervisor_token:
    file: ./prototype/secrets/xray_supervisor_token

volumes:
  xray_supervisor_token_data:

networks:
  control:
    enable_ipv6: true
    internal: true
    ipam:
      config:
        - subnet: 172.31.240.0/24
  egress: {}
