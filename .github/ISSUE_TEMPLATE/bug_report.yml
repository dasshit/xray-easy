name: Bug report
description: Report a reproducible problem with Xray-easy.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: >-
        Before opening an issue, check whether it has already been reported.
        Do not include passwords, tokens, private keys, server addresses, or
        real user data. Report suspected security vulnerabilities privately
        using the link in the issue chooser.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you were doing when it occurred.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Xray-easy version
      description: Provide the release tag or commit, if known.
      placeholder: v1.2.3
    validations:
      required: false

  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Official Docker Compose images
        - Local Docker Compose build
        - Other or not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: >-
        Include only the relevant excerpts. Redact secrets, public server
        addresses, and personal data before posting.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other information that may help diagnose the issue.
    validations:
      required: false
