name: Feature request
description: Suggest an improvement or new capability for Xray-easy.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: >-
        Before opening a request, check whether it has already been discussed.

  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the situation or need behind the request.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe the behavior or solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative solutions you have considered.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add examples, mockups, or other context for the request.
    validations:
      required: false
