name: Project tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web lint, tests, types, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Lint web app
        run: npm run lint
        working-directory: web

      - name: Check web types
        run: npm run typecheck
        working-directory: web

      - name: Run web unit tests
        run: npm test
        working-directory: web

      - name: Enforce web coverage thresholds
        run: npm run test:coverage
        working-directory: web

      - name: Build web app
        run: npm run build
        working-directory: web

      - name: Upload web coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage-report
          path: web/coverage/
          if-no-files-found: ignore

  go:
    name: Go unit tests, race detector, and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go unit tests
        run: go test -count=1 ./cmd/... ./internal/...

      - name: Run race detector
        run: go test -race -count=1 ./cmd/... ./internal/...

      - name: Enforce backend coverage thresholds
        run: bash scripts/backend-coverage.sh coverage.out
        env:
          BACKEND_COVERAGE_MIN: "90"
          BACKEND_PACKAGE_COVERAGE_MIN: "80"

  awg-prototype:
    name: AmneziaWG prototype tests and Linux builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go for the pinned AmneziaWG engine
        uses: actions/setup-go@v7
        with:
          go-version-file: awg-service/go.mod
          cache: true
          cache-dependency-path: awg-service/go.sum

      - name: Run AWG unit tests
        run: go test -count=1 -race ./...
        working-directory: awg-service

      - name: Enforce AWG coverage threshold
        run: bash scripts/awg-coverage.sh
        env:
          AWG_COVERAGE_MIN: "90"

      - name: Build Linux amd64 and arm64 services
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build ./...
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./...
        working-directory: awg-service

  xray-runtime:
    name: Embedded Xray runtime tests, race detector, and per-file coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go for the pinned Xray-core runtime module
        uses: actions/setup-go@v7
        with:
          go-version-file: xray-runtime/go.mod
          cache: true
          cache-dependency-path: xray-runtime/go.sum

      - name: Run embedded Xray runtime tests
        working-directory: xray-runtime
        run: go test -count=1 ./...

      - name: Run embedded Xray runtime race detector
        working-directory: xray-runtime
        run: go test -race -count=1 ./...

      - name: Enforce per-file runtime coverage
        run: bash scripts/xray-runtime-coverage.sh
        env:
          XRAY_RUNTIME_FILE_COVERAGE_MIN: "90"

  publish-images:
    name: Publish Docker Hub images (${{ matrix.image }})
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [web, go, awg-prototype, xray-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: xray-easy
            dockerfile: Dockerfile.control
          - image: xray-easy-controller
            dockerfile: Dockerfile.controller
          - image: xray-easy-runtime
            dockerfile: Dockerfile.xray-runtime
          - image: xray-easy-awg
            dockerfile: Dockerfile.awg
          - image: xray-easy-hysteria-tls
            dockerfile: Dockerfile.hysteria-tls
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate stable release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable release tag in vMAJOR.MINOR.PATCH form, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PERSONAL_ACCESS_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          sbom: true
          provenance: mode=max
