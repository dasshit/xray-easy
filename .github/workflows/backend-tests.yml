name: Project tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web lint, tests, types, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Lint web app
        run: npm run lint
        working-directory: web

      - name: Check web types
        run: npm run typecheck
        working-directory: web

      - name: Run web unit tests
        run: npm test
        working-directory: web

      - name: Enforce web coverage thresholds
        run: npm run test:coverage
        working-directory: web

      - name: Build web app
        run: npm run build
        working-directory: web

      - name: Upload web coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage-report
          path: web/coverage/
          if-no-files-found: ignore

  go:
    name: Go unit tests, race detector, and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go unit tests
        run: go test -count=1 ./cmd/... ./internal/...

      - name: Run race detector
        run: go test -race -count=1 ./cmd/... ./internal/...

      - name: Enforce backend coverage thresholds
        run: bash scripts/backend-coverage.sh coverage.out
        env:
          BACKEND_COVERAGE_MIN: "90"
          BACKEND_PACKAGE_COVERAGE_MIN: "80"
