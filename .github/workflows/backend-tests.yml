name: Backend tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go unit tests, race detector, and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go unit tests
        run: go test -count=1 ./...

      - name: Run race detector
        run: go test -race -count=1 ./...

      - name: Enforce backend coverage thresholds
        run: bash scripts/backend-coverage.sh coverage.out
        env:
          BACKEND_COVERAGE_MIN: "90"
          BACKEND_PACKAGE_COVERAGE_MIN: "80"
