name: Project tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web lint, tests, types, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: web

      - name: Lint web app
        run: npm run lint
        working-directory: web

      - name: Check web types
        run: npm run typecheck
        working-directory: web

      - name: Run web unit tests and enforce coverage thresholds
        run: npm run test:coverage
        working-directory: web

      - name: Build web app
        run: npm run build
        working-directory: web

      - name: Upload web coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: web-coverage-report
          path: web/coverage/
          if-no-files-found: ignore

  go:
    name: Go unit tests, race detector, and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests with race detector and enforce coverage thresholds
        run: |
          mkdir -p "$GITHUB_WORKSPACE/reports/backend"
          bash scripts/backend-coverage.sh "$GITHUB_WORKSPACE/reports/backend/coverage.out"
        env:
          BACKEND_COVERAGE_MIN: "90"
          BACKEND_PACKAGE_COVERAGE_MIN: "80"
          GO_TEST_RACE: "1"
          GO_TEST_JSON: ${{ github.workspace }}/reports/backend/test.jsonl

      - name: Generate Go test and coverage report
        if: always()
        run: bash scripts/go-report.sh "$GITHUB_WORKSPACE" "Backend" "$GITHUB_WORKSPACE/reports/backend/coverage.out" "$GITHUB_WORKSPACE/reports/backend" "$GITHUB_WORKSPACE/reports/backend/test.jsonl" handwritten

      - name: Publish backend Go test results
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v3
        with:
          name: Backend Go tests
          path: reports/backend/junit.xml
          reporter: java-junit

      - name: Upload backend Go report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: go-backend-report
          path: reports/backend/
          if-no-files-found: warn
          retention-days: 14

  awg-prototype:
    name: AmneziaWG prototype tests and Linux builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go for the pinned AmneziaWG engine
        uses: actions/setup-go@v7
        with:
          go-version-file: awg-service/go.mod
          cache: true
          cache-dependency-path: awg-service/go.sum

      - name: Run AWG tests with race detector and enforce coverage threshold
        run: |
          mkdir -p "$GITHUB_WORKSPACE/reports/awg"
          bash scripts/awg-coverage.sh "$GITHUB_WORKSPACE/reports/awg/coverage.out"
        env:
          AWG_COVERAGE_MIN: "90"
          GO_TEST_RACE: "1"
          GO_TEST_JSON: ${{ github.workspace }}/reports/awg/test.jsonl

      - name: Generate AWG test and coverage report
        if: always()
        run: bash scripts/go-report.sh "$GITHUB_WORKSPACE/awg-service" "AmneziaWG" "$GITHUB_WORKSPACE/reports/awg/coverage.out" "$GITHUB_WORKSPACE/reports/awg" "$GITHUB_WORKSPACE/reports/awg/test.jsonl" handwritten

      - name: Publish AWG Go test results
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v3
        with:
          name: AmneziaWG Go tests
          path: reports/awg/junit.xml
          reporter: java-junit

      - name: Upload AWG Go report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: go-awg-report
          path: reports/awg/
          if-no-files-found: warn
          retention-days: 14

      - name: Build Linux amd64 and arm64 services
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build ./...
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./...
        working-directory: awg-service

  xray-runtime:
    name: Embedded Xray runtime tests, race detector, and per-file coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go for the pinned Xray-core runtime module
        uses: actions/setup-go@v7
        with:
          go-version-file: xray-runtime/go.mod
          cache: true
          cache-dependency-path: xray-runtime/go.sum

      - name: Run Xray runtime tests with race detector and enforce per-file coverage
        run: bash scripts/xray-runtime-coverage.sh
        env:
          XRAY_RUNTIME_FILE_COVERAGE_MIN: "90"
          GO_TEST_RACE: "1"
          XRAY_RUNTIME_COVERAGE_DIR: ${{ github.workspace }}/reports/xray
          GO_TEST_JSON: ${{ github.workspace }}/reports/xray/test.jsonl

      - name: Generate Xray runtime test and coverage report
        if: always()
        run: bash scripts/go-report.sh "$GITHUB_WORKSPACE/xray-runtime" "Xray runtime" "$GITHUB_WORKSPACE/reports/xray/runtime.out" "$GITHUB_WORKSPACE/reports/xray" "$GITHUB_WORKSPACE/reports/xray/test.jsonl" xray-runtime

      - name: Publish Xray runtime Go test results
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v3
        with:
          name: Xray runtime Go tests
          path: reports/xray/junit.xml
          reporter: java-junit

      - name: Upload Xray runtime Go report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: go-xray-runtime-report
          path: reports/xray/
          if-no-files-found: warn
          retention-days: 14

  security-audit:
    name: Security audit (Go vet and npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go vet for every Go module
        run: |
          go vet ./...
          (cd awg-service && go vet ./...)
          (cd xray-runtime && go vet ./...)

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund
        working-directory: web

      - name: Audit production web dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: web

  go-docs:
    name: Go Godoc comments
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Require Godoc comments for handwritten APIs
        run: go run ./scripts/check-go-docs.go

  publish-images:
    name: Publish GHCR images (${{ matrix.image }})
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [web, go, awg-prototype, xray-runtime, go-docs]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: control-plane
            dockerfile: Dockerfile.control
          - image: controller
            dockerfile: Dockerfile.controller
          - image: lease-service
            dockerfile: Dockerfile.lease-service
          - image: xray-core-service
            dockerfile: Dockerfile.xray-runtime
          - image: amneziawg-service
            dockerfile: Dockerfile.awg
          - image: hysteria-tls-init
            dockerfile: Dockerfile.hysteria-tls
          - image: installer
            dockerfile: Dockerfile.installer
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate stable release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable release tag in vMAJOR.MINOR.PATCH form, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set image name
        id: image-name
        env:
          IMAGE_COMPONENT: ${{ matrix.image }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${IMAGE_COMPONENT}" >> "$GITHUB_OUTPUT"

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-name.outputs.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }},timeout=30s,ignore-error=true
          sbom: true
          provenance: mode=max
