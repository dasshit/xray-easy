syntax = "proto3";

package xrayeasy.xray.v1;

option go_package = "xray-easy/internal/xrayruntime/api/v1;xrayruntimev1";

import "google/protobuf/timestamp.proto";

// Runtime is the private, product-level API exposed by the embedded Xray
// service. Xray's internal protobuf messages are intentionally not exposed.
service Runtime {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc GetStatus(EmptyRequest) returns (RuntimeStatus);
  rpc GetCapabilities(EmptyRequest) returns (CapabilitiesResponse);
  rpc GetRecentLogs(EmptyRequest) returns (LogsResponse);
  rpc ValidateConfiguration(ConfigurationRequest) returns (ConfigurationResponse);
  rpc ApplyConfiguration(ConfigurationRequest) returns (OperationResponse);
  rpc ReplaceInbound(ReplaceInboundRequest) returns (OperationResponse);
  rpc AddUser(AddUserRequest) returns (OperationResponse);
  rpc RemoveUser(RemoveUserRequest) returns (OperationResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc SetLogLevel(SetLogLevelRequest) returns (OperationResponse);
  rpc GetTelemetry(EmptyRequest) returns (TelemetryResponse);
  rpc WatchTelemetry(WatchTelemetryRequest) returns (stream TelemetryResponse);
  rpc WatchEvents(WatchEventsRequest) returns (stream RuntimeEvent);
  rpc ProbeRealityTarget(ProbeRealityTargetRequest) returns (ProbeResponse);
  rpc ProbeIPv6Egress(EmptyRequest) returns (ProbeResponse);
}

message EmptyRequest {}

message HealthRequest {
  // Health probes use a separate identity from the Controller's control token.
  string probe_id = 1;
}

message HealthResponse {
  bool ready = 1;
  string service_version = 2;
  string xray_core_version = 3;
}

enum Protocol {
  PROTOCOL_UNSPECIFIED = 0;
  PROTOCOL_VLESS = 1;
  PROTOCOL_VMESS = 2;
  PROTOCOL_HYSTERIA2 = 3;
  PROTOCOL_SHADOWSOCKS = 4;
  PROTOCOL_TROJAN = 5;
}

enum RuntimeState {
  RUNTIME_STATE_UNSPECIFIED = 0;
  RUNTIME_STATE_STARTING = 1;
  RUNTIME_STATE_NO_CONFIGURATION = 2;
  RUNTIME_STATE_RUNNING = 3;
  RUNTIME_STATE_STOPPING = 4;
  RUNTIME_STATE_FAILED = 5;
}

message RuntimeStatus {
  RuntimeState state = 1;
  string service_version = 2;
  string xray_core_version = 3;
  int64 active_revision = 4;
  string last_error = 5;
  google.protobuf.Timestamp started_at = 6;
}

message ProtocolCapability {
  Protocol protocol = 1;
  bool configured = 2;
  bool user_management = 3;
  bool traffic_counters = 4;
  bool online_status = 5;
  bool source_ip = 6;
  string inbound_tag = 7;
}

message CapabilitiesResponse {
  repeated ProtocolCapability protocols = 1;
}

message LogEntry {
  google.protobuf.Timestamp timestamp = 1;
  string level = 2;
  string component = 3;
  string message = 4;
}

message LogsResponse { repeated LogEntry entries = 1; }

// configuration_json is an immutable candidate generated by Xray-easy. It
// contains runtime secrets, so the service must not include it in logs or errors.
message ConfigurationRequest {
  bytes configuration_json = 1;
  string operation_id = 2;
  int64 revision = 3;
}

message ConfigurationResponse {
  bool valid = 1;
  string operation_id = 2;
  int64 revision = 3;
  string configuration_digest = 4;
}

message ReplaceInboundRequest {
  bytes candidate_configuration_json = 1;
  bytes previous_configuration_json = 2;
  string inbound_tag = 3;
  string operation_id = 4;
  int64 revision = 5;
}

message AddUserRequest {
  Protocol protocol = 1;
  string email = 2;
  // VLESS/VMess use a UUID; Hysteria 2 uses its per-user auth credential.
  string credential = 3;
  string flow = 4;
  string operation_id = 5;
  // Zero denotes idempotent runtime user-roster convergence without a
  // persisted config revision. Positive revisions are fenced and committed.
  int64 revision = 6;
  // Shadowsocks 2022 method, currently 2022-blake3-aes-256-gcm.
  string shadowsocks_method = 7;
}

message RemoveUserRequest {
  Protocol protocol = 1;
  string email = 2;
  string operation_id = 3;
  // Zero denotes idempotent runtime user-roster convergence without a
  // persisted config revision. Positive revisions are fenced and committed.
  int64 revision = 4;
}

message ListUsersRequest { Protocol protocol = 1; }
message ListUsersResponse { repeated string emails = 1; }

message SetLogLevelRequest {
  string level = 1;
  string operation_id = 2;
}

message WatchEventsRequest {
  uint32 heartbeat_interval_ms = 1;
}

message RuntimeEvent {
  uint64 sequence = 1;
  google.protobuf.Timestamp timestamp = 2;
  string severity = 3;
  string component = 4;
  string event = 5;
  Protocol protocol = 6;
  string user_email = 7;
  string source_ip = 8;
  string detail = 9;
}

message IPObservation {
  string address = 1;
  google.protobuf.Timestamp last_seen = 2;
}

message UserTelemetry {
  string email = 1;
  int64 upload_bytes = 2;
  int64 download_bytes = 3;
  bool online = 4;
  google.protobuf.Timestamp last_seen = 5;
  repeated IPObservation source_ips = 6;
  // Time of the last observed user-data counter increase.
  google.protobuf.Timestamp last_activity = 7;
  Protocol protocol = 8;
}

message TelemetryResponse {
  google.protobuf.Timestamp sampled_at = 1;
  repeated UserTelemetry users = 2;
  // Changes when the runtime process restarts or its counter baseline resets.
  string source_generation = 3;
  uint64 sequence = 4;
  bool full_snapshot = 5;
}

message WatchTelemetryRequest {
  // Requested sampling cadence; the runtime clamps this to a safe range.
  uint32 sample_interval_ms = 1;
}

message ProbeRealityTargetRequest {
  string target = 1;
  string server_name = 2;
}

message ProbeResponse {
  bool ok = 1;
  google.protobuf.Timestamp checked_at = 2;
}

message OperationResponse {
  string operation_id = 1;
  int64 revision = 2;
  bool already_applied = 3;
}
