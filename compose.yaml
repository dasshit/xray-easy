# Existing installations without XRAY_EASY_PROJECT_NAME keep their named volumes.
name: ${XRAY_EASY_PROJECT_NAME:-xray-easy-stage1}

x-logging: &journald-logging
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  data-init:
    image: alpine:3.22
    restart: "no"
    logging: *journald-logging
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        # The TLS volume is mounted beneath read-only /etc/xray in the Xray
        # container. Its mountpoint must already exist in xray_config.
        mkdir -p /data /config/hysteria-tls /tls
        if [ ! -f /config/active.json ]; then cp /bootstrap/active.json /config/active.json; fi
        chown -R 10001:10001 /data /config /tls
    volumes:
      - app_data:/data
      - xray_config:/config
      - hysteria_tls_data:/tls
      - ./prototype/config-stage1:/bootstrap:ro

  runtime-auth-init:
    image: alpine:3.22
    restart: "no"
    logging: *journald-logging
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        if [ ! -s /target/xray_runtime_token ]; then
          head -c 48 /dev/urandom | base64 | tr -d '\n' > /target/xray_runtime_token
          printf '\n' >> /target/xray_runtime_token
        fi
        chown 10001:10001 /target/xray_runtime_token
        chmod 0400 /target/xray_runtime_token
    volumes:
      - xray_runtime_token_data:/target

  runtime-state-init:
    image: alpine:3.22
    restart: "no"
    logging: *journald-logging
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /state
        chown -R 10001:10001 /state
        chmod 0700 /state
    volumes:
      - xray_runtime_state:/state

  controller-auth-init:
    image: alpine:3.22
    restart: "no"
    logging: *journald-logging
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        if [ ! -s /target/controller.token ]; then
          head -c 48 /dev/urandom | base64 | tr -d '\n' > /target/controller.token
          printf '\n' >> /target/controller.token
        fi
        chown 10001:10001 /target/controller.token
        chmod 0400 /target/controller.token
    volumes:
      - controller_token:/target

  awg-auth-init:
    image: alpine:3.22
    restart: "no"
    logging: *journald-logging
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        if [ ! -s /target/control.token ]; then
          head -c 48 /dev/urandom | base64 | tr -d '\n' > /target/control.token
          printf '\n' >> /target/control.token
        fi
        chown 10001:10001 /target/control.token
        chmod 0440 /target/control.token
    volumes:
      - awg_control_token:/target

  hysteria-tls-init:
    image: ghcr.io/${XRAY_EASY_IMAGE_NAMESPACE:-dasshit}/xray-easy/hysteria-tls-init:${XRAY_EASY_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.hysteria-tls
    restart: "no"
    logging: *journald-logging
    user: "0:0"
    tmpfs:
      - /tmp
    environment:
      XRAY_HYSTERIA2_ENABLED: ${XRAY_HYSTERIA2_ENABLED:-false}
      XRAY_HYSTERIA2_TLS_MODE: ${XRAY_HYSTERIA2_TLS_MODE:-legacy}
      XRAY_HYSTERIA2_CERT_IP: ${XRAY_HYSTERIA2_CERT_IP:-}
      XRAY_HYSTERIA2_TLS_SERVER_NAME: ${XRAY_HYSTERIA2_TLS_SERVER_NAME:-}
    volumes:
      - ./secrets/hysteria:/source:ro
      - hysteria_tls_data:/target
    depends_on:
      data-init:
        condition: service_completed_successfully

  xray-core-service:
    image: ghcr.io/${XRAY_EASY_IMAGE_NAMESPACE:-dasshit}/xray-easy/xray-core-service:${XRAY_EASY_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.xray-runtime
      args:
        XRAY_VERSION: ${XRAY_VERSION:-26.7.28}
    restart: unless-stopped
    logging: *journald-logging
    user: "10001:10001"
    command:
      - --listen
      - ${XRAY_EASY_XRAY_IP:-172.31.241.2}:10086
      - --config
      - /etc/xray/active.json
      - --token-file
      - /run/runtime-auth/xray_runtime_token
      - --revision-file
      - /var/lib/xray-runtime/revision-state.json
    environment:
      XRAY_RUNTIME_ADDR: ${XRAY_EASY_XRAY_IP:-172.31.241.2}:10086
      XRAY_RUNTIME_TOKEN_FILE: /run/runtime-auth/xray_runtime_token
      XRAY_RUNTIME_REVISION_FILE: /var/lib/xray-runtime/revision-state.json
    ports:
      - "${XRAY_PUBLIC_PORT:-443}:8443/tcp"
      - "${XRAY_PUBLIC_PORT:-443}:8443/udp"
      - "${XRAY_VMESS_PORT:-9443}:8444/tcp"
      - "${XRAY_SHADOWSOCKS_PORT:-8388}:8388/tcp"
      - "${XRAY_SHADOWSOCKS_PORT:-8388}:8388/udp"
      - "${XRAY_TROJAN_PORT:-10443}:8445/tcp"
    volumes:
      - xray_config:/etc/xray:ro
      - xray_runtime_state:/var/lib/xray-runtime
      - xray_runtime_token_data:/run/runtime-auth:ro
      - hysteria_tls_data:/etc/xray/hysteria-tls:ro
    networks:
      control:
        ipv4_address: ${XRAY_EASY_XRAY_IP:-172.31.241.2}
      egress:
        gw_priority: 1
    depends_on:
      data-init:
        condition: service_completed_successfully
      runtime-auth-init:
        condition: service_completed_successfully
      runtime-state-init:
        condition: service_completed_successfully
      hysteria-tls-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/xray-runtime
        - healthcheck
      interval: 10s
      timeout: 5s
      retries: 5

  controller:
    image: ghcr.io/${XRAY_EASY_IMAGE_NAMESPACE:-dasshit}/xray-easy/controller:${XRAY_EASY_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.controller
    restart: unless-stopped
    logging: *journald-logging
    user: "10001:10001"
    environment:
      XRAY_CONTROLLER_LISTEN: 0.0.0.0:10088
      XRAY_CONTROLLER_ADDR: 127.0.0.1:10088
      XRAY_CONTROLLER_TOKEN_FILE: /run/controller-auth/controller.token
      XRAY_RUNTIME_ADDR: ${XRAY_EASY_XRAY_IP:-172.31.241.2}:10086
      XRAY_RUNTIME_TOKEN_FILE: /run/runtime-auth/xray_runtime_token
      XRAY_CONFIG_DIR: /etc/xray
      AWG_PUBLIC_HOST: ${AWG_PUBLIC_HOST:-}
      AWG_CONTROL_ADDR: ${XRAY_EASY_AWG_IP:-172.31.241.4}:10087
      AWG_CONTROL_TOKEN_FILE: /run/awg-auth/control.token
    volumes:
      - controller_token:/run/controller-auth:ro
      - xray_runtime_token_data:/run/runtime-auth:ro
      - xray_config:/etc/xray:ro
      - awg_control_token:/run/awg-auth:ro
    networks:
      control:
        ipv4_address: ${XRAY_EASY_CONTROLLER_CONTROL_IP:-172.31.241.5}
      backend:
        ipv4_address: ${XRAY_EASY_CONTROLLER_BACKEND_IP:-172.31.242.2}
    depends_on:
      xray-core-service:
        condition: service_healthy
      runtime-auth-init:
        condition: service_completed_successfully
      controller-auth-init:
        condition: service_completed_successfully
      awg-auth-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/xray-controller", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  control-plane:
    image: ghcr.io/${XRAY_EASY_IMAGE_NAMESPACE:-dasshit}/xray-easy/control-plane:${XRAY_EASY_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.control
    restart: unless-stopped
    logging: *journald-logging
    user: "10001:10001"
    environment:
      XRAY_EASY_DATA_DIR: /data
      XRAY_EASY_LISTEN: 0.0.0.0:8080
      XRAY_EASY_VERSION: ${XRAY_EASY_BUILD_VERSION:-dev}
      XRAY_EASY_MASTER_KEY: ${XRAY_EASY_MASTER_KEY:?set XRAY_EASY_MASTER_KEY in .env}
      XRAY_PUBLIC_PORT: ${XRAY_PUBLIC_PORT:-443}
      XRAY_VMESS_PORT: ${XRAY_VMESS_PORT:-9443}
      XRAY_SHADOWSOCKS_PORT: ${XRAY_SHADOWSOCKS_PORT:-8388}
      XRAY_SHADOWSOCKS_ENABLED: ${XRAY_SHADOWSOCKS_ENABLED:-false}
      XRAY_SHADOWSOCKS_METHOD: ${XRAY_SHADOWSOCKS_METHOD:-chacha20-poly1305}
      XRAY_SHADOWSOCKS_NETWORK: ${XRAY_SHADOWSOCKS_NETWORK:-tcp,udp}
      XRAY_TROJAN_PORT: ${XRAY_TROJAN_PORT:-10443}
      XRAY_TROJAN_ENABLED: ${XRAY_TROJAN_ENABLED:-false}
      XRAY_VERSION: ${XRAY_VERSION:-26.7.28}
      XRAY_HYSTERIA2_ENABLED: ${XRAY_HYSTERIA2_ENABLED:-false}
      XRAY_HYSTERIA2_TLS_MODE: ${XRAY_HYSTERIA2_TLS_MODE:-legacy}
      XRAY_HYSTERIA2_CERT_IP: ${XRAY_HYSTERIA2_CERT_IP:-}
      XRAY_HYSTERIA2_TLS_SERVER_NAME: ${XRAY_HYSTERIA2_TLS_SERVER_NAME:-}
      AWG_PUBLIC_HOST: ${AWG_PUBLIC_HOST:-}
      AWG_PUBLIC_PORT: ${AWG_PUBLIC_PORT:-1234}
      XRAY_EASY_UI_PORT: ${XRAY_EASY_UI_PORT:-8080}
      XRAY_EASY_SECURE_COOKIES: ${XRAY_EASY_SECURE_COOKIES:-false}
      XRAY_EASY_TRUST_PROXY: ${XRAY_EASY_TRUST_PROXY:-false}
      XRAY_CONTROLLER_ADDR: ${XRAY_EASY_CONTROLLER_BACKEND_IP:-172.31.242.2}:10088
      XRAY_CONTROLLER_TOKEN_FILE: /run/controller-auth/controller.token
      XRAY_EASY_CONFIG_DIR: /etc/xray
    ports:
      - "127.0.0.1:${XRAY_EASY_UI_PORT:-8080}:8080/tcp"
    volumes:
      - app_data:/data
      - hysteria_tls_data:/data/hysteria-tls
      - xray_config:/etc/xray
      - controller_token:/run/controller-auth:ro
    networks:
      backend:
        ipv4_address: ${XRAY_EASY_BACKEND_IP:-172.31.242.3}
      ui: {}
    depends_on:
      xray-core-service:
        condition: service_healthy
      controller:
        condition: service_healthy
      awg-auth-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  awg-data-init:
    profiles: ["awg", "awg-prototype"]
    image: alpine:3.22
    restart: "no"
    logging: *journald-logging
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /data
        chown -R 0:10001 /data
        chmod 0750 /data
    volumes:
      - awg_data:/data

  amneziawg-service:
    profiles: ["awg", "awg-prototype"]
    image: ghcr.io/${XRAY_EASY_IMAGE_NAMESPACE:-dasshit}/xray-easy/amneziawg-service:${XRAY_EASY_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.awg
    restart: unless-stopped
    logging: *journald-logging
    user: "0:10001"
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    tmpfs:
      - /tmp
      - /run
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"
      net.ipv6.conf.default.forwarding: "1"
    environment:
      AWG_DATA_DIR: /data
      AWG_MASTER_KEY: ${XRAY_EASY_MASTER_KEY:?set XRAY_EASY_MASTER_KEY in .env}
      AWG_PUBLIC_HOST: ${AWG_PUBLIC_HOST:-}
      AWG_PUBLIC_PORT: ${AWG_PUBLIC_PORT:-1234}
      AWG_LISTEN_PORT: ${AWG_LISTEN_PORT:-51820}
      AWG_CONTROL_ADDR: ${XRAY_EASY_AWG_IP:-172.31.241.4}:10087
      AWG_GRPC_LISTEN: ${XRAY_EASY_AWG_IP:-172.31.241.4}:10087
      AWG_CONTROL_TOKEN_FILE: /run/awg-auth/control.token
      AWG_IPV4_POOL: ${AWG_IPV4_POOL:-10.88.0.0/24}
      AWG_IPV6_POOL: ${AWG_IPV6_POOL:-fd88:88:88::/64}
      AWG_DNS_SERVERS: ${AWG_DNS_SERVERS:-1.1.1.1,2606:4700:4700::1111}
      AWG_INTERFACE: ${AWG_INTERFACE:-awg0}
      AWG_JC: ${AWG_JC:-}
      AWG_JMIN: ${AWG_JMIN:-}
      AWG_JMAX: ${AWG_JMAX:-}
      AWG_S1: ${AWG_S1:-}
      AWG_S2: ${AWG_S2:-}
      AWG_S3: ${AWG_S3:-}
      AWG_S4: ${AWG_S4:-}
      AWG_H1: ${AWG_H1:-}
      AWG_H2: ${AWG_H2:-}
      AWG_H3: ${AWG_H3:-}
      AWG_H4: ${AWG_H4:-}
      AWG_I1: ${AWG_I1:-}
      AWG_I2: ${AWG_I2:-}
      AWG_I3: ${AWG_I3:-}
      AWG_I4: ${AWG_I4:-}
      AWG_I5: ${AWG_I5:-}
      AWG_HEADER_PROTECTION_KEY: ${AWG_HEADER_PROTECTION_KEY:-}
      AWG_CONTENT_PADDING_ADDITION: ${AWG_CONTENT_PADDING_ADDITION:-}
      AWG_REKEY_AFTER_TIME: ${AWG_REKEY_AFTER_TIME:-}
      AWG_REKEY_TIMEOUT: ${AWG_REKEY_TIMEOUT:-}
      AWG_REJECT_AFTER_TIME: ${AWG_REJECT_AFTER_TIME:-}
      AWG_KEEPALIVE_TIMEOUT: ${AWG_KEEPALIVE_TIMEOUT:-}
      AWG_MAX_HANDSHAKE_ATTEMPTS: ${AWG_MAX_HANDSHAKE_ATTEMPTS:-}
      AWG_RANDOM_TRAILERS: ${AWG_RANDOM_TRAILERS:-}
      AWG_DISABLE_COOKIES: ${AWG_DISABLE_COOKIES:-}
    ports:
      - "${AWG_PUBLIC_PORT:-1234}:51820/udp"
    volumes:
      - awg_data:/data
      - awg_control_token:/run/awg-auth:ro
    networks:
      control:
        ipv4_address: ${XRAY_EASY_AWG_IP:-172.31.241.4}
      egress:
        gw_priority: 1
    depends_on:
      awg-data-init:
        condition: service_completed_successfully
      awg-auth-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "awg-service", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  app_data:
  xray_config:
  xray_runtime_state:
  xray_runtime_token_data:
  controller_token:
  hysteria_tls_data:
  awg_data:
  awg_control_token:

networks:
  control:
    enable_ipv6: true
    internal: true
    ipam:
      config:
        - subnet: ${XRAY_EASY_CONTROL_SUBNET:-172.31.241.0/24}
  backend:
    internal: true
    ipam:
      config:
        - subnet: ${XRAY_EASY_BACKEND_SUBNET:-172.31.242.0/24}
  egress:
    enable_ipv6: true
  ui: {}
